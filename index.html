<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Minecraft Launcher</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><aside><div class="logo">MINECRAFT<br><span>LAUNCHER</span></div><nav><button class="active" data-page="home">首頁</button><button data-page="versions">版本</button><button data-page="settings">設定</button></nav></aside><main><section id="home" class="page active"><div class="hero"><div><p class="eyebrow">JAVA EDITION</p><h1>準備好開始遊戲了嗎？</h1><p>選擇版本後即可進入啟動設定。</p><button id="play" class="play">▶ 開始遊戲</button></div></div><div class="cards"><div><b>目前版本</b><strong id="currentVersion">1.21.8</strong></div><div><b>帳號</b><strong>本機測試帳號</strong></div><div><b>狀態</b><strong id="status">就緒</strong></div></div></section>
<section id="versions" class="page"><h2>版本庫</h2><div id="versionList"></div></section>
<section id="settings" class="page"><h2>設定</h2><label>記憶體 <input id="ram" type="range" min="1" max="8" value="4"></label><p><span id="ramValue">4</span> GB</p><label>遊戲目錄 <input value=".minecraft" id="gameDir"></label></section></main></div><script src="app.js"></script></body></html>
