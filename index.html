<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Minecraft Launcher</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><aside><div class="logo">MINECRAFT<br><span>LAUNCHER</span></div><nav>
<button class="active" data-page="home">⌂ <span>首頁</span></button><button data-page="versions">▣ <span>版本庫</span></button><button data-page="downloads">↓ <span>下載</span></button><button data-page="settings">⚙ <span>設定</span></button></nav></aside>
<main><header><span>Java Edition</span><button id="login">登入 Microsoft 帳號</button></header>
<section id="home" class="page active"><div class="hero"><div><p class="eyebrow">JAVA EDITION</p><h1>準備好開始遊戲了嗎？</h1><p>選擇版本、設定記憶體，然後啟動你的 Minecraft。</p><button id="play" class="play">▶ 開始遊戲</button></div></div><div class="cards"><div><b>目前版本</b><strong id="currentVersion">1.21.8</strong></div><div><b>帳號</b><strong id="account">未登入</strong></div><div><b>狀態</b><strong id="status">就緒</strong></div></div></section>
<section id="versions" class="page"><h2>版本庫</h2><p class="muted">選擇要使用的 Minecraft Java 版本。</p><div id="versionList"></div></section>
<section id="downloads" class="page"><h2>下載</h2><div class="download-box"><div><b id="downloadVersion">Minecraft 1.21.8</b><p id="downloadStatus">尚未開始下載</p></div><button id="download" class="play">下載版本</button><div class="bar"><i id="progress"></i></div></div></section>
<section id="settings" class="page"><h2>設定</h2><label>記憶體 <input id="ram" type="range" min="1" max="16" value="4"></label><p><span id="ramValue">4</span> GB</p><label>遊戲目錄<input value=".minecraft" id="gameDir"></label></section></main></div><script src="app.js"></script></body></html>
